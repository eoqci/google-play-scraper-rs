[package]
name = "google-play-scraper-rs"
version = "0.1.0"
edition = "2024"
description = "A crate for google play data scraper"
license = "MIT"
repository = "https://github.com/eoqci/google-play-scraper-rs"
readme = "README.md"
keywords = ["google-play-scraper", "google-play"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
regex = "1.10"
url = "2.5.8"
scraper = "0.27.0"
urlencoding = "2.1.3"
